<div class="cols">
  <div class="col blue">
    <h3>CI/CD gave us</h3>
    <ul>
      <li>Repeatable releases</li>
      <li>Automated testing</li>

## Three checkpoints, one application

<table>
<tr><th>Checkpoint</th><th>What we observe</th></tr>
<tr><td>Analyze</td><td>Build metadata, CycloneDX SBOM, Trivy findings</td></tr>
<tr><td>Upgrade</td><td>Migration plan, changed dependencies, app health</td></tr>
<tr><td>Patch</td><td>Patch changes, refreshed SBOM, another scan</td></tr>
</table>

<div class="muted" style="font-size:0.7em; margin-top:0.6em">Compare findings, component counts, startup time, and process memory at each stage.</div>

<div style="font-size:0.65em; margin-top:0.6em"><a href="http://localhost:4173/" target="_blank" rel="noopener">Open the running live demo</a> · <a href="https://github.com/dashaun-tanzu/saa-patch-2-6-trivy-exec">Public demo repository</a></div>

## What did the demo establish?

<ul style="font-size:0.8em">
<li>The plan and diff show what changed</li>
<li>A refreshed SBOM lets us scan the new graph</li>
<li>Health checks confirm the app responds</li>
<li>Behavioral tests and release review still matter</li>
</ul>

<div class="muted" style="font-size:0.65em; margin-top:0.6em">Trivy findings depend on the database and scanned components. Zero findings would not establish that the application has no vulnerabilities. Startup and RSS are observations from this run, not a controlled benchmark.</div>

## What should we repeat across 400 repos?

<div class="cols">
<div class="col teal"><h3>Share</h3><ul><li>The migration recipe</li><li>The version and configuration</li><li>The evidence each PR must include</li></ul></div>
<div class="col violet"><h3>Verify per application</h3><ul><li>Repository-specific changes</li><li>Behavior and integration contracts</li><li>Readiness to release</li></ul></div>
</div>

<div class="muted" style="font-size:0.75em; margin-top:0.6em">Now consider the same workflow with an AI agent making the migration decisions.</div>

## Who pays for the repeated reasoning?

<div class="cols">
<div class="col violet"><h3>Agent per repository</h3><ul><li>Gather context again</li><li>Infer the migration again</li><li>Review each set of decisions</li></ul></div>
<div class="col teal"><h3>Shared recipe</h3><ul><li>Encode the migration decision</li><li>Version and test the transformation</li><li>Apply it to each matching codebase</li></ul></div>
</div>

<div class="muted" style="font-size:0.7em; margin-top:0.5em">Self-hosted inference still consumes hardware, energy, and time.<br/>Recipe execution, testing, and review also have a cost.</div>
<div class="muted" style="font-size:0.5em; margin-top:0.6em">Adapted from <a href="https://dashaun.com/spring-boot-4-1-sweet-and-sour/#/">Spring Boot 4.1: Sweet &amp; Sour</a>, Application Advisor section.</div>

## The cost of a migration

<div class="big" style="font-size:1.15em">Inference + execution + <span class="gold">review</span><br/>+ verification + rework</div>

<div class="muted" style="font-size:0.75em; margin-top:0.7em">Measure the whole path to a change you can release.<br/>A faster first diff may still need more review.</div>
<div class="muted" style="font-size:0.5em; margin-top:0.6em">Adapted from <a href="https://dashaun.com/spring-boot-4-1-sweet-and-sour/#/">Spring Boot 4.1: Sweet &amp; Sour</a>, Application Advisor section.</div>

<span class="kicker violet">consistency</span>

## Variation creates review decisions

<div class="cols">
<div class="col violet"><h3>Per-repo decisions</h3><ul><li>Which dependency replaces this one?</li><li>Which tests should change?</li><li>Does this cleanup belong here?</li></ul></div>
<div class="col teal"><h3>Shared decisions</h3><ul><li>Named recipe and version</li><li>Explicit matching conditions</li><li>Tests for changes and non-changes</li></ul></div>
</div>

<div class="muted" style="font-size:0.7em; margin-top:0.5em">Repositories differ. A reusable transformation should explain which differences matter.</div>
<div class="muted" style="font-size:0.5em; margin-top:0.6em">Adapted from <a href="https://dashaun.com/spring-boot-4-1-sweet-and-sour/#/">Spring Boot 4.1: Sweet &amp; Sour</a>, Application Advisor section.</div>

## Repeatability has conditions

<ul style="font-size:0.8em">
<li>Pin recipe versions and configuration</li>
<li>Control inputs, dependency resolution, and toolchain</li>
<li>Test representative repository variations</li>
<li>Review generated diffs and verify behavior</li>
</ul>

<div class="muted" style="font-size:0.7em; margin-top:0.6em">A repeatable transformation still needs evidence that it is correct.</div>

## One upgrade, 400 repositories

<div class="big" style="font-size:1.05em">30 minutes of review per PR<br/>= <span class="gold">200 review-hours</span></div>

<ul style="font-size:0.75em; margin-top:0.7em">
<li>Which decisions could a shared recipe capture?</li>
<li>Which behavior must each application verify?</li>
<li>What would you measure before scaling?</li>
</ul>

<div class="muted" style="font-size:0.55em; margin-top:0.6em">Illustrative workload. No assumed savings; every generated PR still needs review.</div>

<span class="kicker violet">so which is it?</span>

## N-0, continuously

<div class="big" style="font-size:1.5em">N-0 means: on the <span class="accent">latest patch</span>.</div>
<div class="big muted" style="font-size:0.9em">Of the JVM. Of Spring Boot. Of everything you ship.</div>
<div class="big muted" style="font-size:0.9em">Always. Not "when we get to it."</div>

---

## Two ways to age

<img src="images/n0-stairs.svg" alt="Continuous small steps stay near the top versus one terrifying big-bang upgrade" style="height: 580px"/>

---

## What N-0 buys you

<div class="cols">
  <div class="col teal">
    <h3>security</h3>
    <ul>
      <li>Shorter path from CVE to tested patch</li>
      <li>CVEs become traffic, not fires</li>
      <li>Visible patch status</li>
    </ul>
  </div>
  <div class="col amber">
    <h3>performance</h3>
    <ul>
      <li>New GC, virtual threads, AOT</li>
      <li>Measure startup, memory, and throughput</li>
      <li>Validate gains under your workload</li>
    </ul>
  </div>
  <div class="col violet">
    <h3>people</h3>
    <ul>
      <li>Modern tools attract talent</li>
      <li>Less yak shaving</li>
      <li>Boring upgrades, happy teams</li>
    </ul>
  </div>
</div>

---

<span class="kicker teal">compounding</span>

<div class="big">Every day on N-0, the <span class="accent">next day is cheaper</span>.</div>
<div class="big muted" style="font-size:0.9em">Every day on N-6, the <span class="warn">upgrade gets bigger</span>.</div>

## Good, Better, Best

<img src="images/gbb-ladder.svg" alt="Three tiers: good, better, best" style="height: 520px"/>

<div class="muted" style="font-size:0.7em">What I actually see, across orgs, industries, and continents, in 2026.</div>

---

## Good

<div class="cols">
  <div class="col blue">
    <ul>
      <li>One flagship app on N-0: Java 25, Boot 4.x</li>
      <li>OpenRewrite run <strong>manually</strong>, by hand</li>
      <li>CVEs blocked at the production gate</li>
    </ul>
    <h3>the catch</h3>
    <ul class="red">
      <li>Nothing scales past that one team</li>
      <li>Patching N-2 to N-1 still leaves CVEs open</li>
      <li>The fix depends on who remembers how</li>
    </ul>
  </div>
</div>

---

## Better

<div class="cols">
  <div class="col teal">
    <ul>
      <li>Remediation workflow in CI, for a growing set of repos</li>
      <li>Dependency visibility: what's end-of-life, and where</li>
      <li>One "dead" dependency, migrated off</li>
      <li>Even the untouched apps stay on N-0</li>
      <li>Outcomes measured in dollars</li>
    </ul>
  </div>
</div>

<div class="muted" style="font-size:0.7em; margin-top:0.5em">The tell: the app nobody develops anymore still gets its patches.</div>

---

## Best

<div class="cols">
  <div class="col amber">
    <ul>
      <li>Remediation runs org-wide, as its own workflow</li>
      <li>Proactive: "what's next", not "what broke"</li>
      <li>Named owners maintain the shared recipes</li>
      <li>New repos onboard monthly, pulled by gravity</li>
      <li>Legacy has an owner and an upgrade plan</li>
    </ul>
  </div>
</div>

## A passing build can miss a page

<div class="cols">
  <div class="col red">
    <h3>One mapping</h3>
    <pre><code class="language-java">@GetMapping("/greeting")</code></pre>
    <p style="font-size:0.7em">After the framework upgrade:<br/><code>/greeting</code> → 200<br/><code>/greeting/</code> → 404</p>
  </div>
  <div class="col teal">
    <h3>Preserve both paths</h3>
    <pre><code class="language-java">@GetMapping({
  "/greeting", "/greeting/"
})</code></pre>
    <p style="font-size:0.7em">Both paths → 200<br/>Same greeting, with or without a name.</p>
  </div>
</div>
